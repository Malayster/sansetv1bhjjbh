name = "dinoempire-api"
main = "src/app.js"
compatibility_date = "2026-02-01"
compatibility_flags = [ "nodejs_compat" ]

routes = [ { pattern = "api.dinoempire.my", custom_domain = true } ]

[vars]
NODE_ENV = "production"
CORS_ORIGIN = "https://dinoempire.my,https://www.dinoempire.my,https://admin.dinoempire.my,http://localhost:8000,http://localhost:5173"
CLIENT_URL = "https://dinoempire.my"
API_URL = "https://api.dinoempire.my"
ORDER_NOTIFICATION_EMAIL = "afalfarizy@gmail.com"
CDN_URL = "https://cdn.dinoempire.my"

# ── Pembayaran ToyyibPay ──
# TOYYIBPAY_USER_SECRET_KEY mesti diset sebagai secret:
#   npx wrangler secret put TOYYIBPAY_USER_SECRET_KEY
# Jangan letak dalam vars atau commit.
PAYMENT_PROVIDER = "toyyibpay"
TOYYIBPAY_BASE_URL = "https://toyyibpay.com"
TOYYIBPAY_CATEGORY_CODE = "b4gn1lj7"

# ── E-mel / Penghantaran ──
SMTP_SENDER = "DIN'O EMPIRE <afalfarizy@gmail.com>"
SMTP_REPLY_TO = "afalfarizy@gmail.com"
EMAIL_PROVIDER = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "dino-empire-db"
database_id = "850cd8d2-4a2a-4988-9aee-cd96b50fc257"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "dino-empire-assets"

[[send_email]]
name = "EMAIL"
